version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # ESLint and TypeScript are development tools only. Review minor and
      # patch updates together; keep major changes to their checks separate.
      check-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
